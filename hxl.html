<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HXL.com</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #050510;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .logo {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }
    .subtitle {
      opacity: 0.7;
      margin-bottom: 30px;
    }
    .search-box {
      display: flex;
      gap: 8px;
      width: 60vw;
      max-width: 600px;
    }
    .search-box input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      outline: none;
      font-size: 16px;
    }
    .search-box button {
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: #00ffe0;
      color: #000;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo">HXL.com</div>
  <div class="subtitle">HyperX Lookup · Powered by HXBrowser</div>

  <form class="search-box" action="https://www.google.com/search" method="GET">
    <input type="text" name="q" placeholder="Search with HXL...">
    <button type="submit">Search</button>
  </form>
</body>
</html>
